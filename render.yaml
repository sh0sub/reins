# Render Blueprint for Reins (#38 D11). Steps for a first deploy: docs/deploy.md
# Spec: https://render.com/docs/blueprint-spec
#
# Free plan, no cost:
# reins-web  Next.js dashboard + REST API + PayPal/Telegram webhooks. SQLite (libsql) in /tmp: free instances have no
#            disk, so every boot starts from the seeded demo state: 3 agents and the ledger of a recorded real sandbox
#            run (scripts/demo/fixtures/real-sandbox-run.json, times shifted to the boot). That is what a judge-facing
#            demo wants anyway. Free instances sleep after ~15 min idle; the first request wakes them (~1 min).
# reins-mcp  MCP Streamable HTTP server (POST /mcp); calls reins-web over its public URL (free instances can't use the
#            private network).
# Not included (paid on Render): the daily DevOps demo agent and nightly reconcile cron jobs. Run them by hand instead:
#   REINS_MCP_URL=https://reins-mcp.onrender.com/mcp REINS_API_KEY=rk_live_... pnpm agent:devops
#   curl -X POST -H "Authorization: Bearer $REINS_CRON_SECRET" https://reins-web.onrender.com/api/cron/reconcile
#
# Secrets use `sync: false`: Render asks for them once, when the Blueprint is created.
# NODE_ENV is not set here on purpose: Render sets NODE_ENV=production at runtime only. Setting it for the build
# would make pnpm skip devDependencies (typescript, tsx) that the build and the start command need.

services:
  - type: web
    name: reins-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reins/web build
    # Each boot seeds the demo data (3 agents + the recorded sandbox run) because /tmp starts empty; --if-empty never overwrites.
    startCommand: cd apps/web && node --import tsx ../../scripts/seed.ts --if-empty --db "$DATABASE_URL" && exec node node_modules/next/dist/bin/next start -H 0.0.0.0
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/tmp/reins.db
      # PUBLIC_BASE_URL is optional: the app falls back to RENDER_EXTERNAL_URL (https://reins-web.onrender.com)
      - key: PAYPAL_ENV
        value: sandbox
      # Treasury: approved requests pay a sandbox payee with the Payouts API, so /try completes without a buyer login.
      # Needs TREASURY_PAYEE_EMAIL (secret below); without it the server warns and uses supervised checkout instead.
      - key: PAYPAL_PAYMENT_MODE
        value: treasury
      - key: PAYPAL_VAULT_STORED_CREDENTIAL
        value: "0"
      - key: REINS_TIMEZONE
        value: Asia/Seoul
      # Quiet hours are off for the public demo: judges in other time zones would hit Seoul's night window
      - key: REINS_QUIET_HOURS
        value: "off"
      # Public demo: only the server's demo merchant can be connected (no swapping in visitors' PayPal keys)
      - key: REINS_PUBLIC_DEMO
        value: "1"
      - key: REINS_APPROVAL_TTL_MINUTES
        value: "10080"
      - key: REINS_EXPLAIN_DENIALS
        value: "1"
      - key: TELEGRAM_BOT_USERNAME
        value: ReinsApproveBot
      - key: REINS_TELEGRAM_LOG
        value: "0"
      # Protects POST /api/cron/reconcile (run it by hand; see the header)
      - key: REINS_CRON_SECRET
        generateValue: true
      # Shared with reins-mcp: its keyless demo sessions mint per-session demo keys without the per-IP connect limit
      - key: REINS_MCP_MINT_SECRET
        generateValue: true
      # Keep-warm: reins-web GETs this every 10 minutes so the free reins-mcp instance does not sleep (unset = off)
      - key: REINS_KEEPWARM_URL
        value: https://reins-mcp.onrender.com/health
      # ---- secrets (prompted once at Blueprint creation) ----
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID # known only after registering the webhook URL; can be filled in after the first deploy
        sync: false
      - key: PAYPAL_SANDBOX_MERCHANT_EMAIL
        sync: false
      - key: TREASURY_PAYEE_EMAIL # a sandbox personal account's address (payee of treasury payouts); set by hand in the dashboard
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional AG Grid Enterprise key (removes the trial watermark on the public URL); read at build time
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET # letters, digits, _ and - only (Telegram secret_token rule)
        sync: false

  - type: web
    name: reins-mcp
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node --import tsx apps/mcp/src/http.ts
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public URL of reins-web. If Render gives the service a different subdomain, change it in the Environment tab.
      - key: REINS_API_URL
        value: https://reins-web.onrender.com
      # Keyless demo: `claude mcp add --transport http reins https://reins-mcp.onrender.com/mcp` with no key. Every MCP
      # session gets its own Playground Agent demo key (own velocity scope); per-IP and total session limits in http.ts.
      - key: REINS_PUBLIC_DEMO
        value: "1"
      - key: REINS_MCP_KEYLESS_DEMO
        value: "1"
      - key: REINS_MCP_MINT_SECRET
        fromService:
          type: web
          name: reins-web
          envVarKey: REINS_MCP_MINT_SECRET
